<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>受講生情報復活</title>
  <link th:href="@{/style.css}" rel="stylesheet">
</head>
<body>
<h1>受講生情報の削除復活</h1>

<form th:action="@{/updateStudent}" method="post" th:object="${studentDetail}" id="studentForm">
  <h2>削除済受講生情報</h2>
  <table>
    <input type="hidden" th:field="*{student.id}" />
    <tr>
      <th>名前</th>
      <!-- ひらがな・カタカナ・漢字 -->
      <td>
        <input type="text" th:field="*{student.name}" readonly />
      </td>
    </tr>

    <tr>
      <th>カナ名</th>
      <!-- カタカナだけ -->
      <td>
        <input type="text" th:field="*{student.kanaName}" readonly />
      </td>
    </tr>

    <tr>
      <th>ニックネーム</th>
      <!-- 英数字 -->
      <td>
        <input type="text" th:field="*{student.nickname}" readonly />
      </td>
    </tr>

    <tr>
      <th>メールアドレス</th>
      <td>
        <input type="email" th:field="*{student.email}" readonly />
      </td>
    </tr>

    <tr>
      <th>地域</th>
      <!-- 自由入力でもOK -->
      <td>
        <input type="text" th:field="*{student.area}" readonly />
      </td>
    </tr>

    <tr>
      <th>年齢</th>
      <td>
        <input type="number" th:field="*{student.age}" readonly />
      </td>
    </tr>

    <tr>
      <th>性別</th>
      <td>
        <input type="text" th:field="*{student.sex}" readonly />
<!--        <select th:field="*{student.sex}" readonly>-->
<!--          <option value="">&#45;&#45; 選択してください &#45;&#45;</option>-->
<!--          <option value="男性">男性</option>-->
<!--          <option value="女性">女性</option>-->
<!--          <option value="他">他</option>-->
<!--        </select>-->
      </td>
    </tr>

    <tr>
      <th>備考</th>
      <td>
        <textarea th:field="*{student.remark}" readonly></textarea>
      </td>
    </tr>
  </table>

  <h2>受講コース</h2>
  <div th:if="${#fields.hasErrors('studentsCoursesList')}">
    <p th:errors="*{studentsCoursesList}" style="color: red;"></p>
  </div>

  <table>
    <tr th:each="course, iterStat : *{studentsCoursesList}">
      <td>
        コース名:
        <input type="text"
               th:field="*{studentsCoursesList[__${iterStat.index}__].courseName}"
               readonly  /><br/>

        開始日:
        <input type="date"
               th:field="*{studentsCoursesList[__${iterStat.index}__].courseStartAt}"
               readonly/><br/>

        終了日:
        <input type="date"
               th:field="*{studentsCoursesList[__${iterStat.index}__].courseEndAt}"
               readonly/>
      </td>
    </tr>
  </table>

  <!-- hidden フィールドを削除ボタン用に -->
  <input type="hidden" id="isDeleted" name="student.deleted" th:value="false" />

  <div style="display: flex; justify-content: center; gap: 10px; margin-top: 20px;">
    <!-- 更新ボタン（フォーム送信） -->
<!--    <button type="submit" class="btn btn-primary">更新</button>-->
<!--    <input type="hidden" id="isDeleted" name="student.isDeleted" th:value="false" />-->
    <!-- 削除ボタン（フォーム送信） -->
    <button type="button" class="btn btn-success"
            th:onclick="|document.getElementById('isDeleted').value='false'; document.getElementById('studentForm').submit();|">
      削除復活
    </button>
    <!-- 取り消しボタン（studentList に遷移） -->
    <button type="button"
            class="btn btn-secondary"
            th:onclick="|location.href='@{/studentList}'|">
      取消
    </button>
  </div>
</form>
</body>
</html>
